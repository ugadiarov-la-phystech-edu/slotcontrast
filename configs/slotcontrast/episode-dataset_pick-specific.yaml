experiment_group: slotcontrast
experiment_name: pick-specific

globals:
  NUM_SLOTS: 8
  SLOT_DIM: 64
  DINO_MODEL: vit_small_patch14_dinov2
  FEAT_DIM: 384
  NUM_PATCHES: 576
  NUM_GPUS: 1
  BATCH_SIZE_PER_GPU: 64
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  NUM_CLASSES: ${.NUM_SLOTS}

trainer:
  max_steps: 100000
  log_every_n_steps: 100
  val_check_interval: 312
  gradient_clip_val: 0.05
  accumulate_grad_batches: 1

optimizer:
  name: Adam
  lr: 0.0004
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2500
    decay_steps: ${trainer.max_steps}

model:
  input_type: video
  visualize: true
  visualize_every_n_steps: 99999999999
  visualization_size: [128, 128]
  masks_to_visualize: [decoder_masks,decoder_masks_vis_hard,grouping_masks,grouping_masks_vis_hard,image_decoder_masks,image_decoder_masks_vis_hard]
  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_ss:
      name: Slot_Slot_Contrastive_Loss
      pred_key: processor.state
      temperature: 0.1
      batch_contrast: true
      patch_inputs: false
      keep_input_dim: true
    loss_image_reconstruction:
      name: MSELoss
      pred_key: image_decoder.reconstruction
      target_key: image_decoder.source
      video_inputs: true
      patch_inputs: false
      keep_input_dim: true

  loss_weights:
    loss_featrec: 1.0
    loss_ss: 0.5
    loss_image_reconstruction: 1.0

  initializer:
    name: FixedLearnedInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features:
      - vit_block12
      - vit_block_keys12
      frozen: true
      pretrained: true
      model_kwargs:
        dynamic_img_size: True
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: true

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: MLPDecoder
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: ${globals.FEAT_DIM}
    hidden_dims: [1024, 1024, 1024]
    n_patches: ${globals.NUM_PATCHES}

  image_decoder:
    name: SpatialBroadcastDecoderV2
    inp_dim: ${globals.SLOT_DIM}
    outp_dim: 3
    hidden_size: 128
    image_size: 128

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics:
  ari:
    name: VideoARI
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_ari:
    name: ImageARI
    ignore_background: true
    video_input: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  mbo:
    name: VideoIoU
    matching: overlap
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_mbo:
    name: ImageIoU
    matching: overlap
    ignore_background: true
    video_input: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  miou:
    name: VideoIoU
    matching: hungarian
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  image_miou:
    name: ImageIoU
    matching: hungarian
    ignore_background: true
    video_input: true
    pred_key: decoder_masks_hard
    true_key: segmentations
  per_class_mbo:
    name: VideoPerClassIoU
    matching: overlap
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
    max_classes: ${globals.NUM_CLASSES}
  image_per_class_mbo:
    name: ImagePerClassIoU
    matching: overlap
    ignore_background: true
    video_input: true
    pred_key: decoder_masks_hard
    true_key: segmentations
    max_classes: ${globals.NUM_CLASSES}
  per_class_miou:
    name: VideoPerClassIoU
    matching: hungarian
    ignore_background: true
    pred_key: decoder_masks_hard
    true_key: segmentations
    max_classes: ${globals.NUM_CLASSES}
  image_per_class_miou:
    name: ImagePerClassIoU
    matching: hungarian
    ignore_background: true
    video_input: true
    pred_key: decoder_masks_hard
    true_key: segmentations
    max_classes: ${globals.NUM_CLASSES}

dataset:
  name: EpisodesDataModule
  root: null
  extension: png
  mask_type: instance
  sequence_length: 8
  train_batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: 16
  num_workers: 8
  num_classes: ${globals.NUM_CLASSES}
  train_transforms:
    name: episodes-dataset_train
    type: video
    input_size: 336
    rotation_prob: 0.0
    h_flip_prob: 0.5
    color_jitter_brightness: 0.3
    color_jitter_contrast: 0.3
    color_jitter_saturation: 0.3
    color_jitter_hue: 0.0
    color_jitter_prob: 0.3
  val_transforms:
    name: episodes-dataset_val
    type: video
    input_size: 336
    rotation_prob: 0.0
    h_flip_prob: 0.5
    color_jitter_brightness: 0.3
    color_jitter_contrast: 0.3
    color_jitter_saturation: 0.3
    color_jitter_hue: 0.0
    color_jitter_prob: 0.3
    num_classes: ${globals.NUM_CLASSES}

comet:
  project: null
  run_name: null
  run_id: null
